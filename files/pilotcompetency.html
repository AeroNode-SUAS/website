    <!-- Dark/Light Mode FOUC Script -->
    <script>
        const THEME_KEY_FOUC = 'app-theme-mode';
        const initialTheme = localStorage.getItem(THEME_KEY_FOUC) || 'system';
        const mqFOUC = window.matchMedia('(prefers-color-scheme: dark)');
        if (initialTheme === 'dark' || (initialTheme === 'system' && mqFOUC.matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>

<h4>Please view the videos on a desktop computer for optimal formatting.</h4>
    <script>
        // --- Modal Logic ---
        function openVideoModal(videoUrl, pilotName = 'Pilot') {
            const modal = document.getElementById('videoModal');
            const iframe = document.getElementById('modalIframe');
            const titleEl = document.getElementById('modalPilotTitle');
            if (titleEl) titleEl.textContent = pilotName;
            iframe.src = videoUrl;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.classList.add('overflow-hidden');
        }

        function closeVideoModal() {
            const modal = document.getElementById('videoModal');
            const iframe = document.getElementById('modalIframe');
            iframe.src = '';
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.body.classList.remove('overflow-hidden');
        }

        // Close modal on Escape key press
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeVideoModal();
        });

        // --- Dark/Light Mode System Preferences ---
        const THEME_KEY = 'app-theme-mode';
        const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');

        function applyTheme(theme) {
            const html = document.documentElement;
            let resolvedTheme = theme;
            if (theme === 'system') {
                resolvedTheme = mediaQuery.matches ? 'dark' : 'light';
            }
            if (resolvedTheme === 'dark') {
                html.classList.add('dark');
            } else {
                html.classList.remove('dark');
            }
        }

        // Initialize Theme on load based on system preferences
        const savedTheme = localStorage.getItem(THEME_KEY) || 'system';
        applyTheme(savedTheme);

        mediaQuery.addEventListener('change', () => {
            if ((localStorage.getItem(THEME_KEY) || 'system') === 'system') {
                applyTheme('system');
            }
        });
    </script>
